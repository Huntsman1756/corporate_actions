name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,tooling]"
      - run: python -m pip check
      - run: python -m ruff check src tests scripts
      - run: python -m pytest --no-private-corpus -ra
      - run: python -m build
      - name: Inspect distributions and smoke test the installed wheel
        shell: python
        run: |
          import os
          from pathlib import Path, PurePosixPath
          import subprocess
          import sys
          import tarfile
          import tempfile
          import venv
          import zipfile

          root = Path.cwd().resolve()
          wheels = list((root / "dist").glob("*.whl"))
          sdists = list((root / "dist").glob("*.tar.gz"))
          assert len(wheels) == len(sdists) == 1
          with tarfile.open(sdists[0]) as archive:
              for member in archive.getmembers():
                  if not member.isfile():
                      continue
                  relative = PurePosixPath(*PurePosixPath(member.name).parts[1:])
                  assert relative.as_posix() in {"pyproject.toml", "README.md", ".gitignore", "LICENSE", "PKG-INFO"} or (
                      relative.parts[:2] == ("src", "ca_es") and relative.suffix == ".py"
                  ), member.name
          with zipfile.ZipFile(wheels[0]) as archive:
              assert all(
                  name.startswith("ca_es/") or name.split("/")[0].endswith(".dist-info")
                  for name in archive.namelist()
              )
          with tempfile.TemporaryDirectory() as directory:
              outside = Path(directory)
              environment = outside / "venv"
              venv.EnvBuilder(with_pip=True).create(environment)
              binaries = environment / ("Scripts" if os.name == "nt" else "bin")
              python = binaries / ("python.exe" if os.name == "nt" else "python")
              cli = binaries / ("ca-es.exe" if os.name == "nt" else "ca-es")
              env = dict(os.environ)
              env.pop("PYTHONPATH", None)
              env.pop("PYTHONHOME", None)
              subprocess.run([str(python), "-m", "pip", "install", "--no-deps", str(wheels[0])], cwd=outside, env=env, check=True)
              subprocess.run([str(python), "-m", "pip", "check"], cwd=outside, env=env, check=True)
              subprocess.run([str(python), "-I", "-m", "ca_es", "--help"], cwd=outside, env=env, check=True)
              subprocess.run([str(cli), "--help"], cwd=outside, env=env, check=True)
              smoke = '''
          import json
          from pathlib import Path
          import sys
          import ca_es
          from ca_es.canonical import canonical_json
          from ca_es.cli import main
          assert Path(ca_es.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          assert canonical_json({"value": "0.1250"}) == '{"value":"0.1250"}'
          Path("canon.json").write_text(json.dumps({"events": []}), encoding="utf-8")
          Path("policy.json").write_text(json.dumps({"sources": {}}), encoding="utf-8")
          assert main(["events", "--canon", "canon.json", "--policy", "policy.json"]) == 0
          '''
              subprocess.run([str(python), "-I", "-c", smoke], cwd=outside, env=env, check=True)

  desk:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,desk]"
      - run: python -m pip check
      - run: python -c "import textual"
      - name: Require desk coverage without skips
        shell: python
        run: |
          import pytest
          class NoSkips:
              def pytest_sessionfinish(self, session, exitstatus):
                  reporter = session.config.pluginmanager.getplugin("terminalreporter")
                  if reporter.stats.get("skipped"):
                      session.exitstatus = 1
          raise SystemExit(pytest.main(["tests/unit/test_p1_desk.py", "--no-private-corpus", "-ra"], plugins=[NoSkips()]))

  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - run: sh ./gradlew --no-daemon --dependency-verification=strict build fatJar
        working-directory: adapters/iso-adapter-jvm
      - run: python -m pip install -e ".[dev]"
      - name: Require Python and JVM integration coverage without skips
        shell: python
        env:
          CA_ES_SWIFT_ADAPTER_JAR: ${{ github.workspace }}/adapters/iso-adapter-jvm/build/libs/iso-adapter.jar
        run: |
          import shutil
          import pytest
          from ca_es.swift_mt import default_adapter_jar
          assert shutil.which("java")
          assert default_adapter_jar().is_file()
          class NoSkips:
              def pytest_sessionfinish(self, session, exitstatus):
                  reporter = session.config.pluginmanager.getplugin("terminalreporter")
                  if reporter.stats.get("skipped"):
                      session.exitstatus = 1
          raise SystemExit(pytest.main([
              "tests/unit/test_p4_swift_facts.py",
              "tests/unit/test_p41_swift_ca.py",
              "tests/unit/test_p42_swift_cash.py",
              "tests/unit/test_p52_election.py",
              "tests/unit/test_p55_mt565.py",
              "--no-private-corpus", "-ra",
          ], plugins=[NoSkips()]))
