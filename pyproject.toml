[project]
name = "ca-es"
version = "0.0.1"
description = "Corporate Actions ES — capa abierta, verificable y evidence-first de corporate actions del ecosistema espanol (G0)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
keywords = ["corporate-actions", "spain", "cnmv", "evidence-first"]
dependencies = []

[project.urls]
Homepage = "https://github.com/Huntsman1756/corporate_actions"
Repository = "https://github.com/Huntsman1756/corporate_actions"
Issues = "https://github.com/Huntsman1756/corporate_actions/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.11,<1"]
# Tooling/CI only; el core ca_es es stdlib-only.
tooling = ["jsonschema>=4.21,<5"]
# Ingesta de documentos PDF reales (CNMV). Se importa de forma perezosa;
# el core sigue siendo stdlib-only. Licencia BSD-3-Clause.
pdf = ["pypdf>=4,<6"]
# Ops Desk TUI (P1.2). Importacion perezosa desde cmd_desk; el core
# sigue siendo stdlib-only. Licencia MIT.
desk = ["textual>=0.86,<9"]

[project.scripts]
ca-es = "ca_es.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ca_es"]

[tool.hatch.build.targets.sdist]
only-include = ["src/ca_es", "pyproject.toml", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py311"
extend-exclude = [".venv-audit", ".venv-spikes"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "private_corpus(name): requires --run-private-corpus and authorized LOCAL_ONLY or qualification data",
]
