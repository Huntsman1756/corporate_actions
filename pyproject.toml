[project]
name = "ca-es"
version = "0.0.1"
description = "Corporate Actions ES — capa abierta, verificable y evidence-first de corporate actions del ecosistema espanol (G0)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
# Tooling/CI only; el core ca_es es stdlib-only.
tooling = ["jsonschema>=4.21,<5"]
# Ingesta de documentos PDF reales (CNMV). Se importa de forma perezosa;
# el core sigue siendo stdlib-only. Licencia BSD-3-Clause.
pdf = ["pypdf>=4,<6"]
# Ops Desk TUI (P1.2). Importacion perezosa desde cmd_desk; el core
# sigue siendo stdlib-only. Licencia MIT.
desk = ["textual>=0.86,<9"]

[project.scripts]
ca-es = "ca_es.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ca_es"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
