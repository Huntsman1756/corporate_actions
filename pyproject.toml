[project]
name = "ca-es"
version = "0.0.1"
description = "Corporate Actions ES — capa abierta, verificable y evidence-first de corporate actions del ecosistema espanol (G0)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
tooling = ["jsonschema>=4.21,<5"]

[project.scripts]
ca-es = "ca_es.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ca_es"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
